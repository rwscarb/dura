[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dura"
version = "0.1.0"
description = "Censorship-resistant video PoC — discovery/hosting/download over signed relay events, a real Kademlia DHT, or a TLS-capable NAT-traversal tunnel"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["p2p", "video", "censorship-resistant", "discovery", "dht", "kademlia", "nat-traversal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: File Sharing",
  "Topic :: Internet",
]

# Core runtime: hosting/discovery/download over a relay needs btcvm (for
# ott's merkle_root) and cryptography (Ed25519 identity/signing). DHT,
# QR codes, and the viz demos are genuinely optional -- see below.
dependencies = [
  "btcvm>=1.3.7",
  "cryptography>=41.0",
]

[project.scripts]
dura = "dura:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]
dht = [
  "kademlia>=2.2",
]
qr = [
  "qrcode>=7.4",
]
viz = [
  "matplotlib>=3.8",
]

[tool.setuptools]
# Flat modules, not a package -- matches how dura.py/shell.py/node.py
# already import each other (`import node`, not `from dura import node`).
# poc_reputation is a real runtime dependency (node.py, discovery_relay.py,
# and web_ui.py all import from it), not just a standalone demo script --
# the other poc_*.py/viz_*.py files are, and stay repo-local, run via
# `make`/`python3 poc_x.py` directly rather than installed.
py-modules = [
  "dura", "node", "shell", "discovery_relay", "tunnel_relay", "web_ui",
  "dht", "lightning_settle", "poc_reputation",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
  "E501",  # line too long
  "E741",  # ambiguous variable names (l, O, I)
]
